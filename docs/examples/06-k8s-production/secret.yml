# ============================================
# Secret - 敏感数据（Base64 编码）
# ============================================
# 注意：生产环境应使用更安全的方式管理密钥
# 如：Vault、AWS Secrets Manager、sealed-secrets 等
#
# 生成 Base64 编码：
#   echo -n "your-password" | base64
#   echo -n "your-secret-key" | base64
#
# 解码：
#   echo "eW91ci1wYXNzd29yZA==" | base64 -d
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: production
  labels:
    app: api
type: Opaque
data:
  # base64 编码的值（这里使用示例值，生产环境请替换）
  POSTGRES_USER: YXBwdXNlcg==         # appuser
  POSTGRES_PASSWORD: cGFzc3dvcmQxMjM=  # password123
  SECRET_KEY: c3VwZXItc2VjcmV0LWtleQ== # super-secret-key
