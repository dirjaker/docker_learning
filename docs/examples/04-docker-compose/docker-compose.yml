# ============================================
# Docker Compose 完整示例
# ============================================
# 应用架构：Flask + Redis 计数器
# 演示 Docker Compose 的核心功能：
# - 多服务编排
# - 环境变量管理
# - 数据卷持久化
# - 网络配置
# - 健康检查
# - 服务依赖
# ============================================

version: "3.8"

services:
  # ---- Flask Web 应用 ----
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=${FLASK_ENV:-production}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---- Redis 缓存/存储 ----
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 管理界面（可选）----
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-net
    profiles:
      - debug  # 只在 debug 模式下启动

volumes:
  redis-data:
    driver: local

networks:
  app-net:
    driver: bridge
